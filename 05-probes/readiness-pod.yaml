apiVersion: v1
kind: Pod
metadata:
  name: readiness-demo
  labels:
    app: ready-demo
spec:
  containers:
    - name: nginx
      image: nginx:1.26
      ports:
        - containerPort: 80
      readinessProbe:
        httpGet:
          path: /ready.html
          port: 80
        initialDelaySeconds: 3
        periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: ready-svc
spec:
  selector:
    app: ready-demo
  ports:
    - port: 80
      targetPort: 80
